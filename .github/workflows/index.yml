# Type-checks the scripts, checks their formatting (Prettier) and publishes index.json
# (tools/build-index.mjs) on the `index` branch, where Turu's Search Scripts reads it:
# https://raw.githubusercontent.com/<owner>/<repo>/index/index.json
#
# The `index` branch holds that one file in one commit, replaced on every push to main, so
# main's history only has script changes (VibeSkua's scripts.json is committed to its working
# branch on every push).

name: Index

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the index's added/updated dates come from git log.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Type-check
        run: npx -y -p typescript@5.9.3 tsc --noEmit -p .

      - name: Check formatting
        run: npx -y prettier@3.6.2 --check "**/*.{ts,mjs}"

      - name: Build index.json
        run: node tools/build-index.mjs > "$RUNNER_TEMP/index.json"

      - name: Publish on the index branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cd "$RUNNER_TEMP"
          rm -rf publish && mkdir publish && cd publish
          git init -q -b index
          cp ../index.json .
          git add index.json
          git -c user.name="github-actions[bot]" -c user.email="41898208+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Index of ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" index
